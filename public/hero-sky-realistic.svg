<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Realistic blue sky</title>
  <desc id="desc">A realistic blue daytime sky with soft cloud layers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#61a8f2"/>
      <stop offset="45%" stop-color="#7ec2fb"/>
      <stop offset="100%" stop-color="#d9efff"/>
    </linearGradient>
    <filter id="blur-xl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blur-lg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <radialGradient id="sunGlow" cx="0.24" cy="0.18" r="0.58">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>

  <g fill="#ffffff" opacity="0.8" filter="url(#blur-xl)">
    <ellipse cx="350" cy="285" rx="220" ry="74"/>
    <ellipse cx="560" cy="300" rx="200" ry="62"/>
    <ellipse cx="830" cy="250" rx="240" ry="76"/>
    <ellipse cx="1120" cy="286" rx="230" ry="70"/>
    <ellipse cx="1450" cy="248" rx="220" ry="66"/>
  </g>

  <g fill="#ffffff" opacity="0.62" filter="url(#blur-lg)">
    <ellipse cx="290" cy="442" rx="260" ry="84"/>
    <ellipse cx="660" cy="482" rx="310" ry="92"/>
    <ellipse cx="1120" cy="462" rx="340" ry="102"/>
    <ellipse cx="1520" cy="430" rx="285" ry="88"/>
  </g>

  <g fill="#ffffff" opacity="0.48" filter="url(#blur-lg)">
    <ellipse cx="180" cy="680" rx="280" ry="100"/>
    <ellipse cx="620" cy="724" rx="360" ry="112"/>
    <ellipse cx="1180" cy="748" rx="420" ry="120"/>
    <ellipse cx="1690" cy="702" rx="300" ry="98"/>
  </g>
</svg>
